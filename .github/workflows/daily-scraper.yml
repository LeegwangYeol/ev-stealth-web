name: Daily EV Defect Harvester & Pipeline Sync

on:
  schedule:
    # 21:00 UTC = 06:00 KST daily
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max posts per board/gallery to parse'
        required: false
        default: '20'
        type: string
      mode:
        description: 'Target platforms (all, bobaedream, dcinside, blind)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - bobaedream
          - dcinside
          - blind

permissions:
  contents: write

concurrency:
  group: daily-scraper-pipeline
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    name: Harvest, Classify & Auto-Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: 4. Execute Scraper & NLP Pipeline
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          LIMIT="${{ github.event.inputs.limit || '20' }}"
          if [ -f teamwork_projects/ev_daily_monitor_bot/run_scraper.py ]; then
            python teamwork_projects/ev_daily_monitor_bot/run_scraper.py --sources "$MODE" --limit "$LIMIT" --sync-web --output-path ev-stealth-web/src/data/daily_reports.json
          elif [ -f run_scraper.py ]; then
            python run_scraper.py --sources "$MODE" --limit "$LIMIT" --sync-web --output-path ev-stealth-web/src/data/daily_reports.json
          else
            python scripts/run_scraper.py --sources "$MODE" --limit "$LIMIT" --sync-web --output-path ev-stealth-web/src/data/daily_reports.json
          fi

      - name: 5. Check Git Diff for Changes
        id: git_diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 6. Commit and Push Back to Repository
        if: steps.git_diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE_TAG=$(date -u +"%Y-%m-%d")
          git add ev-stealth-web/src/data/daily_reports.json src/data/daily_reports.json 2>/dev/null || git add .
          git commit -m "[Automated] Daily EV defect reports update (${DATE_TAG})"
          git pull --rebase origin main
          git push origin main

name: Daily EV Defect Harvester & Pipeline Sync

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max posts per board/gallery to parse'
        required: false
        default: '15'
        type: string
      mode:
        description: 'Target platforms (all, bobaedream, dcinside, blind)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - bobaedream
          - dcinside
          - blind

permissions:
  contents: write

concurrency:
  group: daily-scraper-pipeline
  cancel-in-progress: true

jobs:
  scrape-and-publish:
    name: Harvest, Classify & Auto-Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: 4. Execute Scraper & NLP Pipeline
        run: |
          python teamwork_projects/ev_daily_monitor_bot/run_scraper.py --sources all --limit 15 --output-path ev-stealth-web/src/data/daily_reports.json

      - name: 5. Check Git Diff for Changes
        id: git_diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 6. Commit and Push Back to Repository
        if: steps.git_diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ev-stealth-web/src/data/daily_reports.json
          git commit -m "chore(pipeline): auto-update daily EV defect reports [skip ci]"
          git push origin main
